[package]
name = "eyepiece-gui"
description = "Desktop UI for Eyepiece: stream the PC screen to DJI Goggles 3, head tracking, latency comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["x11", "pipewire"]
x11 = ["eyepiece-pc/x11"]
pipewire = ["eyepiece-pc/pipewire"]

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
eyepiece-pc = { path = "../eyepiece-pc", default-features = false, features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
