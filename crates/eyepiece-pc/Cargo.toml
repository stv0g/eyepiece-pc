[package]
name = "eyepiece-pc"
description = "PC side of Eyepiece: stream the PC screen to DJI Goggles 3 over USB (library + CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["x11", "pipewire"]
x11 = ["eyepiece-capture/x11"]
pipewire = ["eyepiece-capture/pipewire"]
# serde derives on cli::Args (settings files of frontends such as eyepiece-gui)
serde = ["dep:serde"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
eyepiece-av = { path = "../eyepiece-av" }
eyepiece-capture = { path = "../eyepiece-capture", default-features = false }
eyepiece-link = { path = "../eyepiece-link" }

[[bin]]
name = "eyepiece-pc"
path = "src/bin/eyepiece-pc.rs"
