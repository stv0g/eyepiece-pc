[package]
name = "usbvr"
description = "PC side of usb-vr: stream the PC screen to DJI Goggles 3 over USB (library + CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["x11"]
x11 = ["usbvr-capture/x11"]
pipewire = ["usbvr-capture/pipewire"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
usbvr-av = { path = "../usbvr-av" }
usbvr-capture = { path = "../usbvr-capture", default-features = false }
usbvr-link = { path = "../usbvr-link" }

[[bin]]
name = "usbvr"
path = "src/main.rs"
